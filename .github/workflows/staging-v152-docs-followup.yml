name: Staging v1.5.2 docs follow-up

on:
  push:
    branches:
      - staging/v1.5.2-forward-hook-bypass-20260905

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply follow-up
        run: python tools/stage_v152_docs_followup.py
      - name: Validate syntax and whitespace
        run: |
          python -m compileall -q vdn_h3 tests tools
          git diff --check
      - name: Commit production follow-up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vdn_h3/apply.py vdn_h3/nodes.py tests/test_runtime_lowvram.py README.md Benchmarks.md docs/UPSTREAM_RECONCILIATION.md
          git diff --cached --quiet && exit 1
          git commit -m 'Complete v1.5.2 non-mutating bypass contract'
          git push
