[project]
name = "comfyui-vdn-h3"
version = "1.3.1"
description = "VDN-H3 hybrid attention for ComfyUI's native MiniMax-H3 model"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Saganaki22" }]
keywords = ["comfyui", "minimax-h3", "vdn", "video", "attention"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Saganaki22/ComfyUI-VDN-H3"
Issues = "https://github.com/Saganaki22/ComfyUI-VDN-H3/issues"
OpenVDN = "https://github.com/OpenVDN/vdn-minimax-h3"

[tool.comfy]
PublisherId = "saganaki22"
DisplayName = "ComfyUI-VDN-H3"
Icon = "https://avatars.githubusercontent.com/u/84208527"
