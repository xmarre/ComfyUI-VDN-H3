name: staging VDN v1.5 release

on:
  push:
    branches: [staging/release-v1.5.0-20260905]

permissions:
  contents: write

env:
  COMFY_SHA: 6c53f8c9a06d95f3d847009ceaae55c624169247
  OPENVDN_SHA: b8cb28fbfca0266d1c7742a9f25ab8b58191de97

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          ref: staging/release-v1.5.0-20260905
      - name: Checkout pinned ComfyUI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          repository: Comfy-Org/ComfyUI
          ref: ${{ env.COMFY_SHA }}
          path: _deps/ComfyUI
      - name: Checkout pinned OpenVDN oracle
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          repository: OpenVDN/vdn-minimax-h3
          ref: ${{ env.OPENVDN_SHA }}
          path: _deps/openvdn
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply release patch
        run: python .github/staging_vdn_release.py
      - name: Install CPU test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision torchaudio
          python -m pip install -r _deps/ComfyUI/requirements.txt
          python -m pip install pytest pytest-timeout ruff safetensors
      - name: Validate
        env:
          COMFYUI_ROOT: ${{ github.workspace }}/_deps/ComfyUI
          OPENVDN_ROOT: ${{ github.workspace }}/_deps/openvdn
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/_deps/ComfyUI:${{ github.workspace }}/_deps/openvdn
        shell: bash
        run: |
          python -m ruff check --select E9,F,B006 --ignore F401,F841 vdn_h3 tests tools
          python -m compileall -q vdn_h3 tests tools
          pytest -q tests --timeout=120
          git diff --check
      - name: Commit validated staging tree and remove staging helpers
        shell: bash
        run: |
          git config user.name xmarre
          git config user.email 54859656+xmarre@users.noreply.github.com
          git add vdn_h3 tests pyproject.toml docs/UPSTREAM_RECONCILIATION.md RELEASE_NOTES.md .github/workflows/release.yml .github/workflows/publish_action.yml
          git commit -m "Prepare VDN-H3 v1.5.0 release"
          git rm .github/workflows/staging_release_v1_5.yml .github/staging_vdn_release.py
          git commit -m "Remove staging release helpers"
          git push origin HEAD:staging/release-v1.5.0-20260905
